name: .NET WPF Build

on:
  push:
    branches: [ "primary", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "primary", "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Build solution
      run: dotnet build src/ReciteHelper.slnx --configuration Release

    - name: Run tests
      run: dotnet test src/ReciteHelper.slnx --configuration Release --no-build

    - name: Publish application
      shell: pwsh
      run: ./build.ps1 -ArtifactsDirectory ./artifacts

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ReciteHelper-App
        path: |
          ./artifacts/publish/
          ./artifacts/reports/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Publish release build
      shell: pwsh
      run: ./build.ps1 -ArtifactsDirectory ./artifacts -Version ${{ github.ref_name }}

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          ./artifacts/*.zip
          ./artifacts/reports/SHA256SUMS.txt
